name: Build AntiESP

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v2
    
    - name: Set up JDK 21
      uses: actions/setup-java@v2
      with:
        java-version: '21'
        distribution: 'adopt'
    
    - name: Build with Maven
      run: mvn -B package --file pom.xml
    
    - name: Upload JAR
      uses: actions/upload-artifact@v2
      with:
        name: AntiESP-1.2.0.jar
        path: target/AntiESP-1.2.0.jar
