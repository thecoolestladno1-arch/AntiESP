name: AntiESP
version: 1.0.0
description: Comprehensive anti-ESP detection plugin for Paper 1.21.11
author: Security Team
main: com.antiesp.plugin.AntiESP

api-version: 1.20.6

softdepend:
  - ViaVersion

commands:
  antiesp:
    description: AntiESP admin command
    usage: /antiesp <reload|status|violations|reset|bypass|stats>
    aliases: [esp, anticheat]
    permission: antiesp.admin

permissions:
  antiesp.admin:
    description: Allows access to admin commands
    default: op
  antiesp.bypass:
    description: Bypass ESP detection
    default: false
